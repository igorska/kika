<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Makeup Guide Book — @kristar.kristina</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --brown: #6B5344;
    --beige: #F5EDE3;
    --brown-dark: #4a3a2d;
    --brown-light: #8a6e5e;
    --shadow: rgba(107,83,68,0.25);
  }

  html, body {
    height: 100%;
    height: 100dvh;
    background: var(--beige);
    font-family: Georgia, 'Times New Roman', serif;
    color: var(--brown-dark);
    overscroll-behavior: none;
  }

  /* ── TOP BAR ── */
  #topbar {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 52px;
    background: var(--brown);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 14px;
    padding-left: max(14px, env(safe-area-inset-left));
    padding-right: max(14px, env(safe-area-inset-right));
    z-index: 100;
    gap: 10px;
    box-shadow: 0 2px 8px var(--shadow);
  }

  #topbar .left, #topbar .right {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }

  #topbar .title {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    color: var(--beige);
    font-size: 14px;
    letter-spacing: 0.5px;
    white-space: nowrap;
    pointer-events: none;
  }

  .btn {
    background: var(--brown-dark);
    color: var(--beige);
    border: none;
    border-radius: 6px;
    padding: 6px 12px;
    font-size: 13px;
    cursor: pointer;
    transition: background 0.15s;
    white-space: nowrap;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    line-height: 1;
  }
  .btn:hover { background: #2e2118; }
  .btn.icon { padding: 6px 10px; font-size: 16px; }

  #page-counter {
    color: var(--beige);
    font-size: 13px;
    min-width: 60px;
    text-align: center;
    opacity: 0.9;
  }

  /* ── MAIN VIEWER ── */
  #viewer {
    padding-top: 52px;
    height: 100%;
    height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    padding-bottom: env(safe-area-inset-bottom);
  }

  #page-img {
    max-height: calc(100dvh - 52px - env(safe-area-inset-bottom));
    max-width: 100%;
    object-fit: contain;
    display: block;
    user-select: none;
    -webkit-user-drag: none;
    transition: opacity 0.18s ease, transform 0.18s ease;
    mix-blend-mode: multiply;
  }
  #page-img.anim-out-left  { opacity: 0; transform: translateX(-32px); }
  #page-img.anim-out-right { opacity: 0; transform: translateX(32px); }
  #page-img.anim-in-left   { opacity: 0; transform: translateX(32px); }
  #page-img.anim-in-right  { opacity: 0; transform: translateX(-32px); }
  #page-img.anim-in-active { opacity: 1; transform: translateX(0); }

  /* ── NAV ARROWS ── */
  .nav-btn {
    position: fixed;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(107,83,68,0.7);
    color: var(--beige);
    border: none;
    width: 40px;
    height: 64px;
    font-size: 22px;
    cursor: pointer;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 90;
    transition: background 0.15s;
    backdrop-filter: blur(2px);
  }
  .nav-btn:hover { background: rgba(107,83,68,0.95); }
  #nav-prev { left: 8px; }
  #nav-next { right: 8px; }

  @media (max-width: 600px) {
    .nav-btn { width: 32px; height: 52px; font-size: 18px; border-radius: 4px; }
    #nav-prev { left: 4px; }
    #nav-next { right: 4px; }

    #topbar .title { font-size: 12px; letter-spacing: 0.3px; }

    .btn { padding: 7px 10px; font-size: 12px; min-height: 36px; }
    .btn.icon { padding: 7px 10px; font-size: 18px; }

    #page-counter { min-width: 44px; font-size: 12px; }
  }

  /* ── TOC PANEL ── */
  #toc-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.35);
    z-index: 200;
  }
  #toc-overlay.open { display: block; }

  #toc-panel {
    position: fixed;
    top: 0; left: 0;
    width: min(320px, 88vw);
    height: 100%;
    background: var(--beige);
    z-index: 201;
    display: flex;
    flex-direction: column;
    transform: translateX(-100%);
    transition: transform 0.25s ease;
    box-shadow: 4px 0 20px var(--shadow);
  }
  #toc-overlay.open #toc-panel { transform: translateX(0); }

  #toc-header {
    background: var(--brown);
    color: var(--beige);
    padding: 16px 18px;
    font-size: 15px;
    letter-spacing: 0.5px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-shrink: 0;
  }

  #toc-close {
    background: none;
    border: none;
    color: var(--beige);
    font-size: 20px;
    cursor: pointer;
    padding: 0 4px;
    line-height: 1;
  }

  #toc-list {
    overflow-y: auto;
    flex: 1;
    padding: 10px 0;
  }

  .toc-item {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 12px 18px;
    cursor: pointer;
    border-bottom: 1px solid rgba(107,83,68,0.12);
    transition: background 0.12s;
    text-decoration: none;
    color: inherit;
  }
  .toc-item:hover { background: rgba(107,83,68,0.1); }
  .toc-item.active { background: rgba(107,83,68,0.18); }

  .toc-num {
    font-size: 11px;
    font-weight: bold;
    color: var(--brown-light);
    min-width: 22px;
    padding-top: 2px;
  }

  .toc-title {
    font-size: 13.5px;
    line-height: 1.45;
    flex: 1;
  }

  .toc-page {
    font-size: 12px;
    color: var(--brown-light);
    padding-top: 2px;
    flex-shrink: 0;
  }

  /* ── LOADING OVERLAY ── */
  #loading {
    position: fixed;
    inset: 0;
    background: var(--beige);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 300;
    font-size: 15px;
    color: var(--brown);
    flex-direction: column;
    gap: 12px;
  }
  #loading.hidden { display: none; }
  .spinner {
    width: 36px; height: 36px;
    border: 3px solid rgba(107,83,68,0.25);
    border-top-color: var(--brown);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<!-- Loading -->
<div id="loading">
  <div class="spinner"></div>
  <span>Загрузка...</span>
</div>

<!-- Top bar -->
<div id="topbar">
  <div class="left">
    <button class="btn icon" id="toc-btn" title="Содержание">&#9776;</button>
  </div>
  <div class="title">MAKEUP GUIDE</div>
  <div class="right">
    <span id="page-counter">1 / 169</span>
    <a class="btn" href="guide.pdf" download title="Скачать PDF">&#8659; Скачать</a>
  </div>
</div>

<!-- Page viewer -->
<div id="viewer">
  <img id="page-img" alt="Страница" draggable="false">
</div>

<!-- Nav arrows -->
<button class="nav-btn" id="nav-prev" title="Назад">&#8249;</button>
<button class="nav-btn" id="nav-next" title="Вперёд">&#8250;</button>

<!-- TOC overlay -->
<div id="toc-overlay">
  <div id="toc-panel">
    <div id="toc-header">
      <span>Содержание</span>
      <button id="toc-close">&#10005;</button>
    </div>
    <div id="toc-list"></div>
  </div>
</div>

<script>
(function () {
  // ── Pages manifest: [pageNumber, extension] ──
  const PAGES = [
    [1,"JPG"],[2,"JPG"],[3,"PNG"],[4,"PNG"],[5,"PNG"],[6,"JPG"],[7,"JPG"],
    [8,"JPG"],[9,"JPG"],[10,"JPG"],[11,"JPG"],[12,"JPG"],[13,"JPG"],[14,"JPG"],
    [15,"JPG"],[16,"JPG"],[17,"JPG"],[18,"JPG"],[19,"JPG"],[20,"JPG"],[21,"JPG"],
    [22,"JPG"],[23,"JPG"],[24,"JPG"],[25,"JPG"],[26,"JPG"],[27,"JPG"],[28,"JPG"],
    [29,"JPG"],[30,"JPG"],[31,"JPG"],[32,"PNG"],[33,"JPG"],[34,"JPG"],[35,"PNG"],
    [36,"PNG"],[37,"JPG"],[38,"JPG"],[39,"PNG"],[40,"PNG"],[41,"JPG"],[42,"PNG"],
    [43,"JPG"],[44,"JPG"],[45,"JPG"],[46,"JPG"],[47,"JPG"],[48,"JPG"],[49,"JPG"],
    [50,"JPG"],[51,"JPG"],[52,"JPG"],[53,"JPG"],[54,"JPG"],[55,"JPG"],[56,"JPG"],
    [57,"JPG"],[58,"JPG"],[59,"PNG"],[60,"PNG"],[61,"JPG"],[62,"JPG"],[63,"JPG"],
    [64,"JPG"],[65,"JPG"],[66,"JPG"],[67,"PNG"],[68,"JPG"],[69,"JPG"],[70,"PNG"],
    [71,"JPG"],[72,"JPG"],[73,"JPG"],[74,"JPG"],[75,"JPG"],[76,"JPG"],[77,"JPG"],
    [78,"JPG"],[79,"JPG"],[80,"JPG"],[81,"JPG"],[82,"JPG"],[83,"JPG"],[84,"JPG"],
    [85,"PNG"],[86,"JPG"],[87,"PNG"],[88,"JPG"],[89,"JPG"],[90,"JPG"],[91,"PNG"],
    [92,"PNG"],[93,"PNG"],[94,"PNG"],[95,"PNG"],[96,"JPG"],[97,"PNG"],[98,"PNG"],
    [99,"PNG"],[100,"PNG"],[101,"PNG"],[102,"PNG"],[103,"PNG"],[104,"PNG"],[105,"PNG"],
    [106,"PNG"],[107,"PNG"],[108,"PNG"],[109,"PNG"],[110,"PNG"],[111,"PNG"],[112,"PNG"],
    [113,"PNG"],[114,"PNG"],[115,"PNG"],[116,"PNG"],[117,"PNG"],[118,"PNG"],[119,"PNG"],
    [120,"PNG"],[121,"PNG"],[122,"PNG"],[123,"PNG"],[124,"PNG"],[125,"PNG"],[126,"PNG"],
    [127,"PNG"],[128,"PNG"],[129,"PNG"],[130,"PNG"],[131,"PNG"],[132,"PNG"],[133,"JPG"],
    [134,"PNG"],[135,"PNG"],[136,"JPG"],[137,"PNG"],[138,"PNG"],[139,"PNG"],[140,"PNG"],
    [141,"PNG"],[142,"PNG"],[143,"PNG"],[144,"PNG"],[145,"PNG"],[146,"PNG"],[147,"JPG"],
    [148,"PNG"],[149,"PNG"],[150,"PNG"],[151,"PNG"],[152,"PNG"],[153,"PNG"],[154,"PNG"],
    [155,"PNG"],[156,"PNG"],[157,"PNG"],[158,"PNG"],[159,"PNG"],[160,"PNG"],[161,"PNG"],
    [162,"JPG"],[163,"JPG"],[164,"JPG"],[165,"PNG"],[166,"PNG"],[167,"PNG"],[168,"PNG"],
    [169,"PNG"]
  ];

  const TOTAL = PAGES.length;

  // fileNum = image filename number (for navigation)
  // bookPage = page number shown inside the image (for display)
  // Offset: file 6.JPG = book page 3, so fileNum = bookPage + 3
  const TOC = [
    { num: 0,  title: "Начало",                          fileNum: 1,   bookPage: 1 },
    { num: 1,  title: "Подготовка кожи к макияжу",    fileNum: 6,   bookPage: 3 },
    { num: 2,  title: "Тональные средства",             fileNum: 26,  bookPage: 23 },
    { num: 3,  title: "Консилер",                       fileNum: 44,  bookPage: 41 },
    { num: 4,  title: "Пудра",                          fileNum: 52,  bookPage: 49 },
    { num: 5,  title: "Контур",                         fileNum: 69,  bookPage: 66 },
    { num: 6,  title: "Бронзер",                        fileNum: 71,  bookPage: 68 },
    { num: 7,  title: "Румяна",                         fileNum: 81,  bookPage: 78 },
    { num: 8,  title: "Хайлайтер",                      fileNum: 94,  bookPage: 91 },
    { num: 9,  title: "Палетки для лица",               fileNum: 104, bookPage: 101 },
    { num: 10, title: "Средства для макияжа глаз",      fileNum: 107, bookPage: 104 },
    { num: 11, title: "Оформление бровей",              fileNum: 130, bookPage: 127 },
    { num: 12, title: "Продукты для губ",               fileNum: 140, bookPage: 137 },
    { num: 13, title: "Спрей для фиксации макияжа",     fileNum: 155, bookPage: 152 },
    { num: 14, title: "Минимальный набор кистей",       fileNum: 160, bookPage: 157 },
  ];

  // Page index = position in PAGES array (0-based)
  // pageNum = the number in the filename (1-based, matches image page numbers)
  let currentIndex = 0;

  const img        = document.getElementById('page-img');
  const counter    = document.getElementById('page-counter');
  const loading    = document.getElementById('loading');
  const tocOverlay = document.getElementById('toc-overlay');
  const tocList    = document.getElementById('toc-list');

  function pageNumToIndex(pageNum) {
    return PAGES.findIndex(p => p[0] === pageNum);
  }

  const preloadCache = {};
  function preloadImg(index) {
    if (index < 0 || index >= TOTAL || preloadCache[index]) return;
    const [num, ext] = PAGES[index];
    const image = new Image();
    image.src = `${num}.${ext}`;
    preloadCache[index] = image;
  }

  let animating = false;

  function goTo(index, direction) {
    if (index < 0) index = 0;
    if (index >= TOTAL) index = TOTAL - 1;
    if (index === currentIndex && img.src) return;
    if (animating) return;

    const prevIndex = currentIndex;
    currentIndex = index;
    const [num, ext] = PAGES[index];
    const src = `${num}.${ext}`;
    const dir = direction !== undefined ? direction : (index > prevIndex ? 1 : -1);

    const outClass = dir > 0 ? 'anim-out-left' : 'anim-out-right';
    const inClass  = dir > 0 ? 'anim-in-left'  : 'anim-in-right';

    animating = true;
    img.classList.add(outClass);

    setTimeout(() => {
      img.classList.remove(outClass);
      img.classList.add(inClass);

      const cached = preloadCache[index];
      if (cached && cached.complete && cached.naturalWidth > 0) {
        img.src = src;
        loading.classList.add('hidden');
      } else {
        loading.classList.remove('hidden');
        img.src = src;
      }

      // Force reflow then animate in
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          img.classList.remove(inClass);
          img.classList.add('anim-in-active');
          setTimeout(() => {
            img.classList.remove('anim-in-active');
            animating = false;
          }, 180);
        });
      });
    }, 180);

    counter.textContent = `${num} / ${PAGES[TOTAL-1][0]}`;
    updateTocActive();
    history.replaceState(null, '', `#${num}`);
    // Preload surrounding pages
    preloadImg(index + 1);
    preloadImg(index + 2);
    preloadImg(index + 3);
    preloadImg(index - 1);
  }

  function updateTocActive() {
    const fileNum = PAGES[currentIndex][0];
    let activeChapter = 0;
    for (const ch of TOC) {
      if (fileNum >= ch.fileNum) activeChapter = ch.num;
    }
    document.querySelectorAll('.toc-item').forEach(el => {
      el.classList.toggle('active', parseInt(el.dataset.num) === activeChapter);
    });
  }

  // Build TOC list
  TOC.forEach(ch => {
    const el = document.createElement('div');
    el.className = 'toc-item';
    el.dataset.num = ch.num;
    el.innerHTML = `
      <span class="toc-num">${ch.num > 0 ? ch.num + "." : "&#8962;"}</span>
      <span class="toc-title">${ch.title}</span>
      <span class="toc-page">${ch.num > 0 ? ch.bookPage : ""}</span>
    `;
    el.addEventListener('click', () => {
      if (ch.href) { window.location.href = ch.href; return; }
      const idx = pageNumToIndex(ch.fileNum);
      if (idx >= 0) goTo(idx);
      closeToc();
    });
    tocList.appendChild(el);
  });

  // Image load events
  img.addEventListener('load', () => { loading.classList.add('hidden'); });
  img.addEventListener('error', () => { loading.classList.add('hidden'); });

  // Navigation
  document.getElementById('nav-prev').addEventListener('click', () => goTo(currentIndex - 1, -1));
  document.getElementById('nav-next').addEventListener('click', () => goTo(currentIndex + 1,  1));

  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft' || e.key === 'ArrowUp')   goTo(currentIndex - 1, -1);
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') goTo(currentIndex + 1,  1);
  });

  // TOC toggle
  function openToc()  { tocOverlay.classList.add('open'); }
  function closeToc() { tocOverlay.classList.remove('open'); }

  document.getElementById('toc-btn').addEventListener('click', openToc);
  document.getElementById('toc-close').addEventListener('click', closeToc);
  tocOverlay.addEventListener('click', e => { if (e.target === tocOverlay) closeToc(); });

  // Touch / swipe
  let touchStartX = 0, touchStartY = 0;
  document.addEventListener('touchstart', e => {
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
  }, { passive: true });
  document.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - touchStartX;
    const dy = e.changedTouches[0].clientY - touchStartY;
    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 40) {
      if (dx < 0) goTo(currentIndex + 1,  1);
      else         goTo(currentIndex - 1, -1);
    }
  }, { passive: true });

  // Init: check URL hash for start page
  function init() {
    const hash = parseInt(window.location.hash.slice(1));
    let startIdx = 0;
    if (!isNaN(hash)) {
      const idx = pageNumToIndex(hash);
      if (idx >= 0) startIdx = idx;
    }
    goTo(startIdx);
    // Preload all TOC bookmark pages in the background
    setTimeout(() => {
      TOC.forEach(ch => {
        const idx = pageNumToIndex(ch.fileNum);
        if (idx >= 0) preloadImg(idx);
      });
    }, 500);
  }

  init();
})();
</script>
</body>
</html>
